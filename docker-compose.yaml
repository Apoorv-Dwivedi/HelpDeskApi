services:
  postgres:
    image: postgres:latest
    container_name: helpdesk
    environment:
      POSTGRES_DB: helpdeskDb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass2helpdeskdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/

volumes:
  postgres_data:

